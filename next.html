<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英作文 猛特訓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecf6;--card:#ffffff;--fg:#111;--mut:#5f6675;--line:#cdd4e6;--soft:#f4f4f4;--ac:#2340C8;--ok:#1a7f3c;--ng:#c62828;--warn:#b26a00;--okbg:#e6f4ea;--ngbg:#fdeaea;--warnbg:#fff3df;--acbg:#e9edfc;--navy:#14275f;--navy-ink:#ffffff;--navy-soft:#a9b9ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1122;--card:#131b33;--fg:#eee;--mut:#9aa3b8;--line:#2a3554;--soft:#1c1c1c;--ac:#7f97ff;--ok:#5fd087;--ng:#ff7a7a;--warn:#ffb648;--okbg:#14301e;--ngbg:#3a1a1a;--warnbg:#3a2c12;--acbg:#1d2544;--navy:#1b2f7c;--navy-ink:#ffffff;--navy-soft:#b4c2ff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;overflow-x:hidden}
.en,textarea,.mono{font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px;min-width:0}
h1{font-size:26px;margin:0;letter-spacing:.02em;line-height:1.2}
.head{background:var(--navy);color:var(--navy-ink);margin:-16px -16px 18px;padding:22px 16px 18px;box-shadow:0 0 0 100vmax var(--navy);clip-path:inset(0 -100vmax)}
.head .brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.head .kick{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--navy-soft);border-left:2px solid var(--navy-soft);padding-left:6px;line-height:1.3}
.head h1{color:var(--navy-ink)}
.head.q{padding:12px 16px;margin-bottom:14px}
.head .qtop{margin:0}
.head .btn.sm{background:transparent;color:var(--navy-ink);border-color:rgba(255,255,255,.45)}
.head .prog{background:rgba(255,255,255,.25)}
.head .prog i{background:var(--navy-ink)}
.head #pnum{color:var(--navy-soft)}
.head.r{padding:18px 16px 14px;margin-bottom:14px}
.head .sub{color:var(--navy-soft);margin:8px 0 0;font-size:13px}
details.pick{background:var(--card);border:1px solid var(--fg);border-radius:3px;padding:0;margin:0}
details.pick>summary{list-style:none;cursor:pointer;padding:11px 38px 11px 12px;font-size:16px;font-weight:400;position:relative;min-height:46px;display:flex;align-items:center;overflow-wrap:anywhere}
details.pick>summary::-webkit-details-marker{display:none}
details.pick>summary::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--fg);border-bottom:2px solid var(--fg);transform:translateY(-70%) rotate(45deg)}
details.pick[open]>summary::after{transform:translateY(-25%) rotate(-135deg)}
.pickbody{padding:10px;border-top:1px solid var(--line)}
h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.field{margin:0 0 14px;min-width:0}
.field>label,.lab{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
select,input[type=text],textarea{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px}
textarea{resize:vertical;line-height:1.5}
.btn{font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--fg);border-radius:3px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px;border-color:var(--line)}
.btn.big{width:100%;font-size:17px;min-height:52px;font-weight:700}
.btn.rec{border-color:var(--ng);color:var(--ng)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--navy);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:8px 4px;border:0;background:var(--card);color:var(--fg);cursor:pointer;min-height:48px;line-height:1.3}
.seg button+button{border-left:1px solid var(--navy)}
.seg button.on{background:var(--navy);color:var(--navy-ink)}
.seg button:disabled{opacity:.35;cursor:default}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 8px}
.chk input{width:18px;height:18px;margin:0;flex:none}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
.warn{background:var(--warnbg);color:var(--warn);padding:8px 10px;border-radius:3px;font-size:13px;margin:0 0 12px}
.info{background:var(--acbg);color:var(--fg);padding:8px 10px;border-radius:3px;font-size:13px;margin:0 0 12px}
details{border-top:1px solid var(--line);padding:10px 0;margin-top:12px}
summary{cursor:pointer;font-size:14px;font-weight:500}
details.guide{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin:0 0 14px}
.guide h3{font-size:13px;margin:12px 0 2px}
.guide p,.guide li{font-size:13px;margin:2px 0}
.guide ul{margin:2px 0;padding-left:1.2em}
.qtop{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.prog{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;min-width:20px}
.prog i{display:block;height:100%;background:var(--fg);width:0}
#pnum{font-size:12px;color:var(--mut);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--mut)}
.tag.full{border-color:var(--ac);color:var(--ac)}
.tag.no{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qjp{font-size:20px;font-weight:500;line-height:1.5;margin:4px 0 10px;overflow-wrap:anywhere}
.enshow{font-size:19px;line-height:1.5;margin:8px 0 10px;min-height:1.5em;color:var(--ac);overflow-wrap:anywhere}
.timer{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.tbar{flex:1;height:8px;background:var(--line);border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--ac)}
.tbar i.low{background:var(--ng)}
#tlabel{font-size:13px;width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.hint{font-size:14px;color:var(--mut);min-height:1em}
.status{font-size:14px;margin:8px 0;min-height:1.4em;color:var(--mut)}
.status.live{color:var(--ac);font-weight:500}
.status.ng{color:var(--ng)}
.badge{display:inline-block;font-weight:700;padding:2px 10px;border-radius:3px;font-size:14px;margin-bottom:8px}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.close{background:var(--warnbg);color:var(--warn)}
.badge.ng{background:var(--ngbg);color:var(--ng)}
.line{margin:6px 0;font-size:16px;overflow-wrap:anywhere}
.line .lab{display:inline;margin-right:6px}
.extra{background:var(--ngbg);color:var(--ng);text-decoration:line-through;padding:0 2px;border-radius:2px}
.miss{background:var(--warnbg);color:var(--warn);font-weight:700;padding:0 2px;border-radius:2px}
.opt{color:var(--mut)}
.eqnote{font-size:12px;color:var(--ok);margin:4px 0}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pausebox{background:var(--card);border:1px dashed var(--fg);border-radius:3px;padding:12px;margin-top:10px;text-align:center}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 16px;text-align:center}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:8px 2px;min-width:0}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sum span{font-size:11px;color:var(--mut)}
.rl{border-top:1px solid var(--line);padding:10px 0;font-size:14px;min-width:0;overflow-wrap:anywhere}
.rl .m{font-weight:700;margin-right:6px}
.rl.ok .m{color:var(--ok)}.rl.close .m{color:var(--warn)}.rl.ng .m{color:var(--ng)}
.setrow{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.setrow span{flex:1;min-width:0;overflow-wrap:anywhere}
.setbox{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:3px;-webkit-overflow-scrolling:touch}
.setitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line);font-size:14px;cursor:pointer;min-width:0}
.setitem:first-child{border-top:0}
.setitem input{width:18px;height:18px;margin:0;flex:none}
.setitem .st{flex:1;min-width:0;overflow-wrap:anywhere}
.setitem .st em{font-style:normal;font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:3px;padding:0 4px;margin-left:4px}
.setitem .pv{display:block;font-size:12px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setitem .sc{font-size:12px;color:var(--mut);white-space:nowrap}
.setbar{display:flex;gap:6px;align-items:center;margin:0 0 6px;flex-wrap:wrap}
.setbar input[type=text]{flex:1;min-width:120px;padding:7px 10px;font-size:14px}
.err{color:var(--ng);font-size:13px;white-space:pre-line;margin:6px 0}
.okmsg{color:var(--ok);font-size:13px;white-space:pre-line;margin:6px 0}
.hidden{display:none!important}
.rowbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ver{color:var(--mut);font-size:11px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script src="drill-problems.js"></script>
<script>
(function(){
'use strict';

var VER='2.0';
/* AIに渡す分割プロンプト（prompts/fixed.txt と prompts/free.txt から組み込み） */
var PROMPTS={fixed:"あなたは、英作文・スピーキング教材の作成者です。\n私が渡す「日本語の文」と「英文」のペアを、積み上げ式の練習問題に分割してください。\n英文は、1文字も変えてはいけません。切って並べるだけです。\n\n■ 練習の仕組み\n日本語の意味のかたまりごとに短い部品を出題し、少しずつつなげて、最後に全文を英語で言えるようにします。\n\n■ 出力の形式\n・コードブロック1つだけを出力します。ブロックの外には、説明・前置き・あとがきを一切書きません。\n・1行が1問です。形は「日本語｜English」。区切りは全角の縦棒「｜」を1つだけ使います。日本語側にも英語側にも「｜」は入れません。\n・1行目は「# セット名」。入力の内容を表す短い日本語の題にします。\n・入力の1文ごとに、その積み上げの最後の行（全文の行）だけ、行頭に「★」を付けます。\n\n■ ルール\n1. 英文は書き換えない。単語、語順、大文字・小文字、句読点（, ; . など）、ハイフン、かっこも、原文のまま。文法や表現に疑問があっても直しません。\n2. 分ける単位は「日本語の意味のかたまり」です（主語のまとまり、動作、修飾する節、時・場所・理由・条件を表す句など）。英語の語順で並べます。日本語の語順と違うときは、その英語のかたまりが表す意味を、自然な日本語で書きます。\n3. 各行の英語は、全文の英語の「連続した一部分」にします。途中を飛ばしたり、順序を入れ替えたりしません（例外は、ルール6の主語の補いだけ）。\n4. 英語のかたまりは、だいたい2〜8語です。冠詞・前置詞・接続詞だけで始まる、または終わる切り方はしません。句読点は、そのかたまりの後ろに付いているものを、そのまま残します。\n5. 積み上げの並べ方：部品を左から順に出し、隣り合う部品を「つなげる行」で合体させ、最後に全文にします。\n　例（A, B, C, D は部品）：A → B → A+B → C → D → C+D → 全文\n　・つなげる行の英語は、隣り合う部品（またはつなげた行）を、そのままつなげたものです。\n　・つなげる行の日本語は、日本語の部品を自然につなげた文です（助詞・語尾は整えてよい）。\n　・最後の行は、入力の日本語の文と英文を、そのまま使います（★付き）。\n6. 主語の補い（部品の行だけ。つなげる行と全文の行には、絶対に補わない）：\n　動詞・助動詞から始まって主語がない部品は、先頭に主語（必要なら be動詞・助動詞）を1〜3語補い、単独で言える文にします。and / but で始まるときは、and / but を外して補います。\n　　例：is going to treat us → It is going to treat us\n　　例：and invited us to dinner → They invited us to dinner\n　補ったときは、日本語の先頭にも「(それは)」「(彼らは)」のように、かっこで主語を添えます。\n　補わないもの：so that / because / if / when / to不定詞 / 前置詞句で始まる部品、名詞句、命令文、動名詞・分詞（-ing, -ed）から始まる句。\n7. 英語に主語や目的語があるのに、その日本語の部品には出てこないとき（日本語で省略される「私は」など）は、日本語にかっこで「(私は)」のように添えます。\n8. 行数の目安（1文あたり、つなげる行と全文の行を含む）：英語10語以下→3〜5行／11〜20語→5〜8行／21語以上→7〜12行。\n9. 迷ったら、小さく自然なかたまりを選びます。\n\n■ 出力の前の確認（頭の中で行い、結果は書かない）\n□ 全行の英語が、全文の連続した一部分か（ルール6の補いを除く）\n□ つなげる行が、部品の単純なつなぎか\n□ 各行の日本語が、その行の英語の意味と合っているか\n□ 全文の行の英文が、入力の英文と1文字も違わないか\n□ 各文の最後の行に★が付いているか\n\n■ 例1\n（入力）\n経済的に苦しかったので、私達は一流ホテルで結婚披露宴を行う計画を断念せざるを得なかった。｜Our difficult economic situation made us give up the plan to have our wedding reception at a first-class hotel.\n\n（出力）\n```\n# 例文：計画の断念\n私達の経済的に苦しい状況が｜Our difficult economic situation\n(それが)私達に計画を断念させた｜It made us give up the plan\n経済的に苦しかったので、私達は計画を断念せざるを得なかった｜Our difficult economic situation made us give up the plan\n結婚披露宴を行う｜to have our wedding reception\n一流ホテルで｜at a first-class hotel.\n一流ホテルで結婚披露宴を行う｜to have our wedding reception at a first-class hotel.\n★経済的に苦しかったので、私達は一流ホテルで結婚披露宴を行う計画を断念せざるを得なかった。｜Our difficult economic situation made us give up the plan to have our wedding reception at a first-class hotel.\n```\n\n■ 例2\n（入力）\n少年はつまずいて転んだ拍子にうさぎ風船を手放し、それが満月の夜空に上って行くのを見つめた。｜The boy let the rabbit-shaped balloon go and watched it rise into the night sky lit by the full moon when he stumbled and fell.\n\n（出力）\n```\n# 例文：風船\n少年はうさぎ風船を手放し｜The boy let the rabbit-shaped balloon go\n(彼は)それが上って行くのを見つめた｜He watched it rise\n少年はうさぎ風船を手放し、それが上って行くのを見つめた｜The boy let the rabbit-shaped balloon go and watched it rise\n夜空へ｜into the night sky\n満月に照らされた｜lit by the full moon\n満月に照らされた夜空へ｜into the night sky lit by the full moon\n少年はうさぎ風船を手放し、それが満月の夜空に上って行くのを見つめた｜The boy let the rabbit-shaped balloon go and watched it rise into the night sky lit by the full moon\nつまずいて転んだ拍子に｜when he stumbled and fell.\n★少年はつまずいて転んだ拍子にうさぎ風船を手放し、それが満月の夜空に上って行くのを見つめた。｜The boy let the rabbit-shaped balloon go and watched it rise into the night sky lit by the full moon when he stumbled and fell.\n```\n\n■ 入力\n（ここから下を、あなたの文に書き換えてください。1行に1文、「日本語｜English」の形で書きます。複数の文を入れてもかまいません。）\n日本語の文。｜English sentence.\n",free:"あなたは、英作文・スピーキング教材の作成者です。\n私が渡す「日本語の文」を、正確な英文に訳し、その英文を積み上げ式の練習問題に分割してください。\n英文は、最初に1つ決めたら、そのあと1文字も変えてはいけません。\n\n■ 練習の仕組み\n日本語の意味のかたまりごとに短い部品を出題し、少しずつつなげて、最後に全文を英語で言えるようにします。\n\n■ 手順\n1. 日本語の文ごとに、英訳を1つ決める。（下の「英訳のルール」）\n2. その英文を、下の「分割のルール」で、積み上げ式の問題にする。\n3. コードブロック1つだけを出力する。\n\n■ 英訳のルール\n・日本語の意味を、落とさず、足さず、正確に訳します。\n・文法的に正しい、自然で標準的な英語にします。\n・特に指定がなければ、中学〜高校レベルの一般的な語彙と文型を使います。難しい語や、めずらしいイディオムは避けます。\n・日本語の1文は、原則として英語の1文に訳します（日本語の「。」の数を変えない）。\n・英訳が複数考えられるときは、最も標準的なものを1つだけ選びます。\n・関係詞節、分詞句、when / if / because などの節、to不定詞、前置詞句のように、かたまりに切りやすい構造を使ってかまいません。ただし、不自然にしてはいけません。\n・省略される主語（日本語の「私は」「彼らは」など）は、英語では自然に補います。\n\n■ 出力の形式\n・ function parseLines(text,lastFull){
  var lines=String(text).split(/\r?\n/),items=[],errors=[],title='';
  lines.forEach(function(raw,idx){
    var line=raw.trim();if(!line)return;
    if(/^[#＃]/.test(line)){if(!title)title=line.replace(/^[#＃]\s*/,'').trim();return}
    var full=false;
    if(/^[★☆]/.test(line)){full=true;line=line.replace(/^[★☆]\s*/,'')}
    var m=line.match(/^(.*?)\s*[|｜\t]\s*(.*)$/);
    if(!m||!m[1].trim()||!m[2].trim()){errors.push((idx+1)+'行目：「日本語｜英語」の形になっていません');return}
    items.push({q:m[1].trim(),a:m[2].trim(),full:full,line:idx+1});
  });
  if(lastFull&&items.length&&!items.some(function(x){return x.full}))items[items.length-1].full=true;
  return {title:title,items:items,errors:errors};
}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function keyOf(q,a){
  var s=String(q)+'\u0001'+String(a),h=5381;
  for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}
  return (h>>>0).toString(36);
}
function isWeak(e){return !!e&&e.s<2&&(e.ng+e.close)>0}
function mergeLog(a,b){
  var out={},k;
  for(k in a)if(HAS.call(a,k))out[k]=a[k];
  for(k in b)if(HAS.call(b,k)){if(!out[k]||(b[k].n||0)>(out[k].n||0))out[k]=b[k]}
  return out;
}
/* ---- 追加する問題のチェック：全部品が「全文の連続した一部分」か ---- */
function ptoks(s){var k=plainKey(s);return k?k.split(' '):[]}
function hasSeq(w,p){
  if(!p.length)return false;
  for(var i=0;i+p.length<=w.length;i++){
    var ok=true;
    for(var k=0;k<p.length;k++){if(w[i+k]!==p[k]){ok=false;break}}
    if(ok)return true;
  }
  return false;
}
/* 連続した一部分、または、先頭の1〜3語（補った主語）を除くと連続した一部分 */
function partOk(part,whole){
  var w=ptoks(whole),p=ptoks(part);
  if(hasSeq(w,p))return true;
  for(var k=1;k<=3;k++){var r=p.slice(k);if(r.length>=2&&hasSeq(w,r))return true}
  return false;
}
function checkItems(items){
  var warns=[],start=0;
  items.forEach(function(it,i){
    if(!it.full)return;
    for(var j=start;j<i;j++){
      if(!partOk(items[j].a,it.a))warns.push({i:j,line:items[j].line||(j+1),a:items[j].a,kind:'part'});
    }
    start=i+1;
  });
  if(start<items.length)warns.push({i:start,line:items[start].line||(start+1),a:items[start].a,kind:'nofull'});
  return warns;
}
function stripFences(t){
  return String(t).split(/\r?\n/).filter(function(l){return !/^\s*```/.test(l)}).join('\n');
}
function fromJson(d){
  var arr=Array.isArray(d)?d:(d&&Array.isArray(d.sets)?d.sets:(d&&Array.isArray(d.items)?[d]:[]));
  var out=[];
  arr.forEach(function(s){
    if(!s||!Array.isArray(s.items))return;
    var items=s.items.filter(function(it){return it&&typeof it.q==='string'&&typeof it.a==='string'})
      .map(function(it,i){return {q:it.q.trim(),a:it.a.trim(),full:!!(it.full||it.f),line:i+1}});
    if(items.length)out.push({title:String(s.title||''),items:items});
  });
  return out;
}
/* 貼り付けた文字を読み取る。「日本語｜英語」の行（コードブロック付きでも可）とJSONの両方に対応 */
function parseInput(text,lastFull){
  var t=stripFences(text).trim();
  if(/^[\[{]/.test(t)){
    var d;
    try{d=JSON.parse(t)}catch(e){return {sets:[],errors:['JSONとして読み込めません。カンマやかっこの抜けがないか確認してください。']}}
    var sets=fromJson(d);
    if(!sets.length)return {sets:[],errors:['JSONの中に問題が見つかりません。']};
    sets.forEach(function(s){if(lastFull&&!s.items.some(function(x){return x.full}))s.items[s.items.length-1].full=true});
    return {sets:sets,errors:[]};
  }
  var r=parseLines(t,lastFull);
  return {sets:r.items.length?[{title:r.title,items:r.items}]:[],errors:r.errors};
}

function logAdd(key,v,timeout){
  var e=log[key]||(log[key]={n:0,ok:0,close:0,ng:0,to:0,s:0,l:'',t:0});
  e.n++;e[v]++;if(timeout)e.to++;
  e.s=(v==='ok')?e.s+1:0;e.l=v;e.t=Date.now();
  saveLog();
}

function allSets(){
  var out=[],seen={};
  (window.DRILL_SETS||[]).forEach(function(s,i){
    var t=s.title||('セット'+(i+1)),id='b:'+t;
    if(seen[id])id+='#'+i;
    seen[id]=1;
    out.push({id:id,title:t,items:s.items||[],custom:false});
  });
  store.custom.forEach(function(s){out.push({id:'c'+s.id,cid:s.id,title:s.title,items:s.items,custom:true})});
  return out;
}
function buildQueue(){
  var off=cfg('off'),fm=cfg('filter');
  var sets=allSets().filter(function(s){return off.indexOf(s.id)<0});
  var ord=cfg('order');
  if(ord==='setshuffle')sets=shuffle(sets);
  var q=[];
  sets.forEach(function(s){s.items.forEach(function(it){
    var key=keyOf(it.q,it.a),e=log[key];
    if(fm==='weak'&&!isWeak(e))return;
    if(fm==='unseen'&&e)return;
    q.push({q:it.q,a:it.a,full:!!it.full,set:s.title,key:key});
  })});
  if(ord==='shuffle')q=shuffle(q);
  return q;
}
function countBy(pred){
  var n=0;
  allSets().forEach(function(s){s.items.forEach(function(it){if(pred(log[keyOf(it.q,it.a)]))n++})});
  return n;
}

/* ===== 音声（読み上げ／認識） ===== */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var hasTTS=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
var speakTok=0;
function cancelSpeech(){speakTok++;try{if(hasTTS)window.speechSynthesis.cancel()}catch(e){}}
function pickVoice(lang){
  try{
    var vs=window.speechSynthesis.getVoices();
    for(var i=0;i<vs.length;i++){if(String(vs[i].lang).replace('_','-').toLowerCase().indexOf(lang.toLowerCase())===0)return vs[i]}
  }catch(e){}
  return null;
}
function speak(text,lang,cb,rate){
  var tok=++speakTok,fired=false;
  function done(){if(fired||tok!==speakTok)return;fired=true;if(cb)cb()}
  if(!hasTTS){setTimeout(done,300);return}
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang;u.rate=rate||1;
    var v=pickVoice(lang);if(v)u.voice=v;
    u.onend=done;u.onerror=done;
    window.speechSynthesis.speak(u);
    setTimeout(done,Math.max(4000,text.length*(lang==='ja-JP'?500:180)+3000));
  }catch(e){setTimeout(done,300)}
}
function speakJa(t,cb){speak(String(t).replace(/[()（）]/g,''),'ja-JP',cb,1)}
function speakEn(t,cb){speak(String(t).replace(/[()（）]/g,''),'en-US',cb,0.95)}
function speakEnN(t,n,cb,id){
  var k=0;
  (function again(){
    if(id!==undefined&&id!==runId)return;
    speakEn(t,function(){
      k++;
      if(k<n){waitT=setTimeout(again,700)}else if(cb)cb();
    });
  })();
}
var actx=null;
function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!actx)actx=new AC();
    var o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=880;g.gain.value=0.08;o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+0.12);
  }catch(e){}
}
var rec=null;
function stopRec(){
  if(rec){var r=rec;rec=null;r.onend=null;r.onerror=null;r.onresult=null;try{r.abort()}catch(e){}}
}
function startRec(cb){
  if(!SR){cb.error('unsupported');return false}
  stopRec();
  var r;
  try{
    r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    var got='';
    r.onresult=function(e){
      var t='';for(var i=0;i<e.results.length;i++){t+=e.results[i][0].transcript+' '}
      got=t.trim();cb.text(got);
    };
    r.onerror=function(e){cb.error(e.error||'error')};
    r.onend=function(){if(rec===r)rec=null;cb.end(got)};
    rec=r;r.start();
  }catch(e){rec=null;cb.error('start');return false}
  return true;
}

/* ===== タイマー ===== */
var T={h:0,end:0,total:0,cb:null};
function stopTimer(){if(T.h){clearTimeout(T.h);T.h=0}T.cb=null}
function updT(left){
  var f=$('#tfill');if(!f)return;
  f.style.width=(100*left/T.total)+'%';
  f.classList.toggle('low',left/T.total<0.25);
  $('#tlabel').textContent=Math.ceil(left/1000)+'秒';
}
function startTimer(sec,cb){
  stopTimer();T.total=sec*1000;T.end=Date.now()+T.total;T.cb=cb;
  (function tick(){
    var left=T.end-Date.now();
    if(left<=0){updT(0);var f=T.cb;T.cb=null;T.h=0;if(f)f();return}
    updT(left);T.h=setTimeout(tick,100);
  })();
}
function limitSec(q){
  var t=cfg('time');
  if(t==='none')return 0;
  if(String(t).indexOf('auto')===0){var m=parseFloat(String(t).slice(4))||1;return Math.max(5,Math.round((3+wc(q.a)*1.2)*m))}
  return parseInt(t,10)||0;
}

function bindBackup(){
  $('#bExport').onclick=function(){
    var data={app:'eisaku-drill',v:2,custom:store.custom,log:log};
    copyText(JSON.stringify(data),$('#exHolder'));
  };
  $('#bImport').onclick=function(){
    var msg=$('#imMsg'),raw=$('#imText').value.trim(),d;
    try{d=JSON.parse(raw)}catch(e){msg.className='err';msg.textContent='読み込めません。書き出した文字を、そのまま貼り付けてください。';return}
    if(!d||d.app!=='eisaku-drill'){msg.className='err';msg.textContent='この文字は、猛特訓の書き出しではありません。';return}
    var added=0;
    (Array.isArray(d.custom)?d.custom:[]).forEach(function(s){
      if(!s||!s.id||!s.title||!Array.isArray(s.items))return;
      var items=s.items.filter(function(it){return it&&typeof it.q==='string'&&typeof it.a==='string'});
      if(!items.length)return;
      if(store.custom.some(function(x){return x.id===String(s.id)}))return;
      store.custom.push({id:String(s.id),title:String(s.title),items:items.map(function(it){return {q:it.q,a:it.a,full:!!it.full}})});
      added++;
    });
    if(d.log&&typeof d.log==='object'&&!Array.isArray(d.log)){log=mergeLog(log,d.log);saveLog()}
    save();
    pendingMsg='読み込みました。追加した問題のセット：'+added+'件。記録も合わせました。';
    showSetup();
  };

function pauseQuiz(){

function resumeQuiz(){

/* --- 通常・連続 --- */
function startQuestion(){
  stopAll();
  var q=cur(),auto=S.mode==='auto',id=runId;
  S.done=false;S.began=false;S.hints=0;S.begin=null;
  updateHead();
  $('#ans').value='';$('#hint').textContent='';
  $('#answerArea').classList.remove('hidden');
  if($('#bJa'))$('#bJa').classList.remove('hidden');
  $('#result').classList.add('hidden');$('#result').innerHTML='';
  $('#timer').classList.add('hidden');
  $('#bMic').textContent='マイク';$('#bMic').classList.remove('rec');
  $('#bJudge').disabled=true;$('#bMic').disabled=true;$('#bHint').disabled=true;
  var sec=limitSec(q);
  var begin=function(){
    if(id!==runId||S.began)return;
    S.began=true;
    if(auto){beep();setTimeout(function(){autoListen(id)},180)}
    else{$('#bJudge').disabled=false;$('#bMic').disabled=false;$('#bHint').disabled=false;setStatus('答えてください','live')}
    if(sec){
      $('#timer').classList.remove('hidden');
      startTimer(sec,function(){finishQ(id,currentText(),'time')});
    }
  };
  S.begin=begin;
  if(cfg('readJa')){setStatus('問題を聞いています…');speakJa(q.q,begin)}
  else begin();
}
function currentText(){return ($('#ans')?$('#ans').value:'')}
function toggleMic(){
  var b=$('#bMic'),id=runId;
  if(rec){stopRec();b.textContent='マイク';b.classList.remove('rec');return}
  if(!SR){setStatus('この環境ではマイクが使えません。キーボードの音声入力で答えてください。','ng');$('#ans').focus();return}
  var base=$('#ans').value.trim();
  b.textContent='停止';b.classList.add('rec');
  startRec({
    text:function(t){if(id!==runId)return;$('#ans').value=(base+' '+t).trim()},
    error:function(c){
      if(id!==runId)return;
      if(c==='not-allowed'||c==='service-not-allowed'||c==='unsupported'){setStatus('マイクが使えません。ブラウザで直接開いて許可するか、キーボードの音声入力で答えてください。','ng');$('#ans').focus()}
    },
    end:function(){if(id!==runId)return;b.textContent='マイク';b.classList.remove('rec')}
  });
}
/* 連続モード：話し声が止まったら自動で確定する。認識が切れたときの再開は最小限にする */
function autoListen(id){
  if(id!==runId)return;
  var q=cur(),expected=wc(q.a),sec=limitSec(q);
  var acc='',part='',done=false,fatal=false,restarts=0,silT=0,noneT=0;
  function text(){return (acc+' '+part).trim()}
  function show(){var a=$('#ans');if(a)a.value=text()}
  function clearAll(){clearTimeout(silT);clearTimeout(noneT)}
  function finish(){if(done||id!==runId)return;done=true;clearAll();finishQ(id,text(),'auto')}
  function armSilence(){
    clearTimeout(silT);
    var w=wc(text());if(!w)return;
    var ms=w>=expected*0.9?1300:(w>=expected*0.6?2000:2800);
    silT=setTimeout(finish,ms);
  }
  setStatus('話してください','live');
  // 制限時間なしのとき、何も話さないまま止まらないように待ち時間を設ける
  if(!sec)noneT=setTimeout(function(){if(!text())finish()},14000);
  function listen(){
    if(done||id!==runId||fatal)return;
    startRec({
      text:function(t){if(done||id!==runId)return;part=t;show();clearTimeout(noneT);armSilence()},
      error:function(c){
        if(done||id!==runId)return;
        if(c==='not-allowed'||c==='service-not-allowed'||c==='unsupported'||c==='start'){
          fatal=true;stopTimer();clearAll();
          setStatus('マイクが使えません。ブラウザで直接開いて許可するか、通常モードで使ってください。','ng');
        }else if(c==='network'){
          fatal=true;stopTimer();clearAll();
          setStatus('音声認識のサーバーに接続できません。通信を確認するか、通常モードを使ってください。','ng');
        }
        // no-speech / aborted は onend 側で処理する
      },
      end:function(){
        if(done||id!==runId||fatal)return;
        if(part){acc=text();part='';show()}
        if(acc&&wc(acc)>=expected*0.7){finish();return}
        restarts++;
        if(restarts>10&&!acc){finish();return}
        setTimeout(listen,restarts>3?600:200);
      }
    });
  }
  listen();
}

/* --- 判定と結果表示 --- */
var VLAB={ok:'正解',close:'おしい',ng:'ちがう'};
function finishQ(id,text,reason){
  if(id!==runId||S.done)return;
  S.done=true;stopTimer();stopRec();
  var q=cur(),j=judge(text,q.a);
  var label=VLAB[j.v];
  if(reason==='skip')label='スキップ';
  else if(j.empty&&reason==='time')label='時間切れ';
  else if(j.empty&&reason==='auto')label='無回答';
  logAdd(q.key,j.v,reason==='time');
  S.res.push({q:q.q,a:q.a,user:String(text||'').trim(),v:j.v,label:label,set:q.set,full:q.full,key:q.key,to:reason==='time'});
  var hu=j.U.words.map(function(w,k){return j.wu[k]?esc(w.raw):'<span class="extra">'+esc(w.raw)+'</span>'}).join(' ');
  var hm=j.M.words.map(function(w,k){
    if(j.wm[k])return w.opt?'<span class="opt">'+esc(w.raw)+'</span>':esc(w.raw);
    return '<span class="miss">'+esc(w.raw)+'</span>';
  }).join(' ');
  var auto=S.mode==='auto';
  var lastOne=(S.i+1>=S.queue.length&&!cfg('loop'));
  var h='<span class="badge '+j.v+'">'+esc(label)+'</span>'+(reason==='time'&&!j.empty?' <span class="tag">時間切れ</span>':'')+
    (j.note?'<div class="eqnote">言い方が違うだけ（短縮形・数字・（ ）の省略など）なので、同じ意味として正解にしました。</div>':'')+
    '<div class="line en"><span class="lab">あなた</span>'+(hu||'（無回答）')+'</div>'+
    '<div class="line en"><span class="lab">お手本</span>'+hm+'</div>'+
    '<div class="rbtns">'+(auto?'':'<button id="bSay" class="btn">お手本を聞く</button>')+'<button id="bNext" class="btn pri"'+(auto?' style="grid-column:1/3"':'')+'>'+(lastOne?'結果へ':'次へ')+'</button></div>';
  $('#answerArea').classList.add('hidden');
  if($('#bJa'))$('#bJa').classList.add('hidden');
  setStatus('');
  var r=$('#result');r.innerHTML=h;r.classList.remove('hidden');
  if($('#bSay'))$('#bSay').onclick=function(){speakEn(q.a)};
  $('#bNext').onclick=next;
  var go=function(){
    if(id!==runId)return;
    if(auto)wait(cfg('pause')*1000,function(){if(id===runId)next()});
  };
  if(cfg('readEn'))speakEnN(q.a,auto?cfg('enRepeat'):1,go,id);else go();
}
function next(){
  stopAll();S.i++;
  if(S.i>=S.queue.length){
    if(cfg('loop')){
      var q=buildQueue();
      if(q.length){S.round++;S.queue=q;S.i=0;startQuestion();return}
    }
    showResult();
  }else startQuestion();
}
function quit(){
  stopAll();
  if(S&&S.res.length)showResult();else showSetup();
}

/* --- 聞き流し（ループ再生） --- */
function listenQuestion(){
  stopAll();
  var q=cur(),id=runId,gap=cfg('gap')*1000,n=cfg('enRepeat');
  updateHead();
  $('#enshow').textContent='';
  setStatus('日本語','live');
  function playEn(k){
    if(id!==runId)return;
    if(cfg('listenShow'))$('#enshow').textContent=q.a;
    setStatus('英語 '+(k+1)+' / '+n,'live');
    speakEn(q.a,function(){
      if(id!==runId)return;
      if(k+1<n)wait(900,function(){playEn(k+1)});
      else wait(gap,function(){if(id===runId)nextListen()});
    });
  }
  speakJa(q.q,function(){
    if(id!==runId)return;
    setStatus('言ってみましょう…','live');
    wait(gap,function(){playEn(0)});
  });
}
function nextListen(){
  stopAll();S.i++;
  if(S.i>=S.queue.length){
    if(cfg('loop')){
      var q=buildQueue();
      if(q.length){S.round++;S.queue=q;S.i=0;listenQuestion();return}
    }
    pendingMsg='聞き流しが終わりました（'+S.queue.length+'問）。';
    showSetup();return;
  }
  listenQuestion();
}

/* ===== 結果画面 ===== */
function showResult(){
  stopAll();lockOff();
  if(S)S.finished=true;
  var r=S.res,c={ok:0,close:0,ng:0};
  r.forEach(function(x){c[x.v]++});
  var to=r.filter(function(x){return x.to}).length;
  var h='<div class="head r"><div class="brand"><h1>結果</h1></div></div><div class="sum"><div><b>'+r.length+'</b><span>解いた数</span></div><div><b style="color:var(--ok)">'+c.ok+'</b><span>正解</span></div><div><b style="color:var(--warn)">'+c.close+'</b><span>おしい</span></div><div><b style="color:var(--ng)">'+c.ng+'</b><span>ちがう</span></div></div>';
  if(S.round>1)h+='<p class="note">'+S.round+'周目まで進みました。</p>';
  if(to)h+='<p class="note">時間切れ：'+to+'問</p>';
  var wrong=r.filter(function(x){return x.v!=='ok'});
  h+='<p class="note">間違えた問題は「苦手」に記録されました。設定の「絞り込み」で「苦手だけ」を選ぶと、復習できます。</p>';
  h+='<div class="rowbtn">'+(wrong.length?'<button id="bRetry" class="btn pri">間違いだけやり直す（'+wrong.length+'問）</button>':'')+'<button id="bAgain" class="btn">もう一度（並べ替え）</button></div><button id="bSetup" class="btn" style="width:100%">設定へ戻る</button><div style="margin-top:14px">';
  h+=r.map(function(x,k){
    return '<div class="rl '+x.v+'"><span class="m">'+esc(x.label)+'</span>No.'+(k+1)+' '+esc(x.q)+
      '<div class="en">あなた：'+(esc(x.user)||'（無回答）')+'</div><div class="en">お手本：'+esc(x.a)+'</div></div>';
  }).join('');
  h+='</div>';
  app.innerHTML=h;
  var mode=S.mode;
  if($('#bRetry'))$('#bRetry').onclick=function(){
    startQuiz(wrong.map(function(x){return {q:x.q,a:x.a,full:x.full,set:x.set,key:x.key}}));
  };
  $('#bAgain').onclick=function(){var q=buildQueue();if(q.length)startQuiz(q);else showSetup()};
  $('#bSetup').onclick=showSetup;
}

showSetup();
})();
</script>
